# Include inside the HTTPS VirtualHost only. mod_proxy_http, headers, auth_basic required.
ProxyPassMatch "^(/api/problem-reports)$" "http://127.0.0.1:8770$1" connectiontimeout=5 timeout=30 retry=0
ProxyPass "/problem-reports/api/" "http://127.0.0.1:8770/problem-reports/api/" connectiontimeout=5 timeout=30 retry=0
ProxyPassReverse "/problem-reports/api/" "http://127.0.0.1:8770/problem-reports/api/"

<LocationMatch "^/api/problem-reports$">
    ProxyPreserveHost Off
    Require expr "%{REQUEST_METHOD} == 'POST'"
    LimitRequestBody 33554432
    RequestHeader unset X-Problem-Report-Client
    RequestHeader set X-Problem-Report-Client "expr=%{REMOTE_ADDR}"
</LocationMatch>

RedirectMatch 308 ^/problem-reports$ /problem-reports/
<Location "/problem-reports/">
    AuthType Basic
    AuthName "Workshop Verwaltung"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/.htpasswd-workshop-zuordnung
    Require valid-user
    ProxyPreserveHost Off
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
</Location>
<Directory "/var/www/html/problem-reports">
    Options -Indexes -ExecCGI
    AllowOverride None
    AuthType Basic
    AuthName "Workshop Verwaltung"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/.htpasswd-workshop-zuordnung
    Require valid-user
    AddType text/javascript .mjs .js
    Header always set Cache-Control "no-store"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'"
</Directory>
