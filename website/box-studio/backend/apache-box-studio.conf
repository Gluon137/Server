# Include inside the existing HTTPS VirtualHost.
RedirectMatch 308 ^/box-studio$ /box-studio/
ProxyPass /box-studio/api/ http://127.0.0.1:8767/api/ connectiontimeout=5 timeout=40 retry=0
ProxyPassReverse /box-studio/api/ http://127.0.0.1:8767/api/
<Location "/box-studio/api/">
    ProxyPreserveHost Off
    Require all granted
    LimitRequestBody 4194304
</Location>
<Directory "/var/www/html/box-studio">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    AddType text/javascript .mjs .js
    Header set X-Content-Type-Options "nosniff"
    Header set Cache-Control "no-cache"
    Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
</Directory>
<LocationMatch "^/box-studio/(?:backend(?:/|$)|(?:.*/)?\.[^/]+)">
    Require all denied
</LocationMatch>
