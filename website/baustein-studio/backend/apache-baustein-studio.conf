# Include only inside the HTTPS virtual host.
RedirectMatch 308 ^/baustein-studio$ /baustein-studio/
ProxyPass /baustein-studio/api/ http://127.0.0.1:8766/api/ connectiontimeout=5 timeout=30 retry=0
ProxyPassReverse /baustein-studio/api/ http://127.0.0.1:8766/api/
<Location "/baustein-studio/api/">
    ProxyPreserveHost Off
    Require all granted
    LimitRequestBody 262144
</Location>
<Directory "/var/www/html/baustein-studio">
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
    AddType text/javascript .mjs .js
    Header set X-Content-Type-Options "nosniff"
    Header set Cache-Control "no-cache"
    Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'"
</Directory>
<LocationMatch "^/baustein-studio/(?:backend(?:/|$)|(?:.*/)?\.[^/]+)">
    Require all denied
</LocationMatch>
